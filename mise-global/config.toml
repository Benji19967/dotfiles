# Global tools, active in every directory.
# Deployed to ~/.config/mise/config.toml by the [dotfiles] table in ../mise.toml.
#
# Backends:
#   default / aqua: upstream release binaries (static Go/Rust tools, no deps)
#   conda:          conda-forge builds, for tools without portable upstream
#                   binaries (C tools with lib deps, or no macOS release)
# Nothing here needs sudo. Installs go to $MISE_DATA_DIR (= $XDG_DATA_HOME/mise),
# which moves to $DOT_ROOT on small-home machines (see shell-base 10_env.sh).
#
# Add a tool:  mise use -g <tool>   (edits this file through the symlink -> commit)

[tools]
# --- core CLI ----------------------------------------------------------------
"conda:git" = "latest"
gh = "latest"
delta = "latest"
lazygit = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
"conda:eza" = "latest"      # upstream ships no macOS binary
bat = "latest"
zoxide = "latest"
jq = "latest"
"conda:htop" = "latest"
tealdeer = "latest"
"conda:unzip" = "latest"    # mason needs it
"conda:wget" = "latest"
"conda:rsync" = "latest"
"conda:nnn" = "latest"

# --- editor / terminal -------------------------------------------------------
"aqua:neovim/neovim" = "latest"
# nvim-treesitter (main branch) needs the CLI. Upstream linux binary needs
# glibc >= 2.39 (Rocky 9 has 2.34) -> conda-forge build there.
tree-sitter = { version = "latest", os = ["macos"] }
"conda:tree-sitter-cli" = { version = "latest", os = ["linux"] }
tmux = "latest"             # prebuilt tmux-builds
shellcheck = "latest"

# --- languages / build -------------------------------------------------------
# node: pyright & other mason LSPs. Upstream linux binaries (node >= 23) need
# libatomic.so.1, missing on minimal RHEL/Rocky -> conda-forge build there.
node = { version = "lts", os = ["macos"] }
"conda:nodejs" = { version = "latest", os = ["linux"] }
uv = "latest"               # python: `uv python install 3.12` (replaces pyenv)
pixi = "latest"
make = "latest"             # conda:make
cmake = "latest"
hyperfine = "latest"
dust = "latest"
yarn = "1"                  # classic, matches old brew yarn
java = "temurin-21"
maven = "latest"
"conda:pkg-config" = "latest"
"conda:erlang" = "latest"   # prebuilt; core:erlang compiles from source
"conda:elixir" = "latest"
julia = "latest"
ruby = "3.1"

# --- dev tools ---------------------------------------------------------------
stylua = "latest"
ast-grep = "latest"
nushell = "latest"
git-lfs = "latest"
dbmate = "latest"           # DB migrations
"conda:redis-server" = "latest"
neo4j = "latest"

# --- media / docs (decker, image rendering in nvim) --------------------------
"conda:imagemagick" = "latest"
"conda:ghostscript" = "latest"
"conda:chafa" = "latest"
"conda:gnuplot" = "latest"
"conda:pdf2svg" = "latest"
"conda:graphviz" = "latest"

# --- optional ----------------------------------------------------------------
# postgres = "latest"         # conda:postgresql
# "conda:xclip" = { version = "latest", os = ["linux"] }

# --- brew --------------------------------------------------------------------
[bootstrap.packages]
"brew:unar" = "latest"
"brew:coreutils" = "latest"   # g-prefixed; conda:coreutils would shadow BSD ls/date/...
"brew:nmap" = "latest"
"brew-cask:font-meslo-lg-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:nikitabobko/tap/aerospace" = "latest"

[settings]
# Don't prompt on first use of a tool on a new machine.
yes = true
